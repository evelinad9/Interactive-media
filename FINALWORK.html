<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <!-- Camera Rig -->
      <a-entity
        id="cameraRig"
        cursor-teleport="cameraRig: #cameraRig; cameraHead: #head; collisionEntities: .collision; ignoreEntities: .clickable"
      >
        <a-entity
          id="head"
          position="0 1.6 0"
          camera
          look-controls="reverseMouseDrag: true"
        ></a-entity>

        <!-- VR Hand Controls -->
        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 100"
          line="color: red; opacity: 0.75"
          blink-controls="cameraRig: #cameraRig; teleportOrigin: #head; collisionEntities:.collision"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable"
          line="color: red; opacity: 0.75"
          blink-controls="cameraRig: #cameraRig; teleportOrigin: #head; collisionEntities:.collision"
        ></a-entity>
      </a-entity>

      <!-- Sceneries -->

      <a-asset-item
        id="Scenery"
        src="arctic_environment_-_past.glb"
      ></a-asset-item>
      <a-gltf-model
        class="collision"
        src="#Scenery"
        gltf-model="arctic_environment_-_past.glb"
        scale="2 2 2"
        shadow=""
        rotation="0 -180 0"
      ></a-gltf-model>

      <a-asset-item
        id="Scenery2"
        src="arctic_environment_-_present.glb"
      ></a-asset-item>
      <a-gltf-model
        class="collision"
        src="#Scenery2"
        gltf-model="arctic_environment_-_present.glb"
        position="0 0 -125"
        scale="2 2 2"
        shadow=""
        rotation="0 -90 0"
      ></a-gltf-model>

      <a-asset-item
        id="Scenery3"
        src="low_poly_arctic_scene (1).glb"
      ></a-asset-item>
      <a-gltf-model
        class="collision"
        src="#Scenery3"
        gltf-model="low_poly_arctic_scene (1).glb"
        position="0 0.63424 -250"
        scale="30 30 30"
        shadow=""
        rotation="0 -180 0"
      ></a-gltf-model>

      <a-asset-item id="Scenery4" src="old_bridge.glb"></a-asset-item>
      <a-gltf-model
        class="collision"
        src="#Scenery4"
        gltf-model="old_bridge.glb"
        position="19.93583 -0.055 -61.73346"
        scale="3.35 2.47 3.92"
        shadow=""
        rotation="0 -90 0"
      ></a-gltf-model>

      <a-gltf-model
        class="collision"
        src="#Scenery4"
        gltf-model="old_bridge.glb"
        position="1.02395 0.29158 -192.31832"
        scale="6.5 2.47 4.42"
        shadow=""
        rotation="0 -90 -1.92"
      ></a-gltf-model>

      <!-- WORLD WATER AROUND -->
      <a-plane
        class="not-collision"
        position="0 -0.2 0"
        rotation="-90 0 0"
        width="300"
        height="300"
        color="#6bb8e8"
        roughness="0.25"
        metalness="0.05"
        opacity="0.75"
        transparent="true"
        scale="5 5 5"
      ></a-plane>

      <!-- Arctic Environment -->
      <!-- <a-entity
        environment="
          preset: arctic;
          lighting: sunset;
          shadow: true;
          shadowSize: 2048;
        "
      ></a-entity> -->

      <!-- Lighting -->
      <a-light

        color="#FFFFFF"
        intensity="1.5"
        position="-5 10 7"
        shadow="cast: true; mapSize: 2048"
      ></a-light>
      <a-light type="ambient" color="#B0E0F0" intensity="0.8"></a-light>

      <!-- Ice Ridge 1 -->
      <a-box
        position="-5 -0.56368 -8"
        width="3"
        height="2.5"
        depth="8"
        color="#B8E8F0"
        shadow=""
        class="collision"
      ></a-box>

        radius-top="0.5"
